name: TechNest SEO checks

on:
  push:
    branches:
      - seo-google
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://www.technestprototyping.ro
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:19876
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-for-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
      - name: Verify server-rendered SEO HTML (mock data, no real database)
        run: node scripts/seo-smoke-test.mjs
